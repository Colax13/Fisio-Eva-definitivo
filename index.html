apia nel 2011 con voto 110/110 con Lode presso l’Università Cattolica del Sacro Cuore, con una tesi in Riabilitazione Neurologica. Nello stesso anno frequenta il Corso Taping Neuromuscolare e Human Tecar Certified Operator. Prosegue il percorso di studi frequentando il Master di I livello in Rieducazione Posturale Globale di P. Souchard e la formazione superiore in RPG adatta alle Patologie Cranio Cervicali. Approfondisce le competenze relative alla rieducazione posturale frequentando vari corsi di formazione come: «Piede Postura ed Equilibrio», «Articolazione Temporo-Mandibolare: Valutazione e Trattamento», «Corso di Perfezionamento Pilates Reformer 1». Nel 2015 si specializza in Linfodrenaggio Manuale avvicinandosi quindi alla riabilitazione di patologie o disturbi linfatici e vascolari. Completa il percorso di studi in Osteopatia presso la scuola EDUCAM - Complementary and Alternative Medicine Education, con votazione finale di 110/110 con lode. Grazie agli studi effettuati per la sua tesi conclusiva «Approccio osteopatico al dolore lombosacrale mediante il trattamento della cicatrice da taglio cesareo» si specializza nel trattamento delle donne in gravidanza e post-parto.","image":"https://www.fisioeva.it/team/azzurra.webp","url":"https://www.fisioeva.it/team","worksFor":{"@id":"https://www.fisioeva.it/#studio"},"workLocation":{"@id":"https://www.fisioeva.it/#studio"},"hasCredential":{"@type":"EducationalOccupationalCredential","credentialCategory":"Iscrizione all'albo professionale","name":"Albo dei Fisioterapisti n. 6174","recognizedBy":{"@type":"Organization","name":"Ordine TSRM-PSTRP di Roma"}}},{"@type":"Person","@id":"https://www.fisioeva.it/team#elisa-de-rubeis","name":"Elisa De Rubeis","honorificPrefix":"Dott.ssa","jobTitle":"Fisioterapista","description":"Si è laureata in Fisioterapia nel 2004 con 110/110 e lode, con una tesi sul legame tra emozione, postura e respiro — il filo che ha poi seguito in tutta la sua formazione. Ha proseguito con il master i       <h1>FisioEVA — Studio di Fisioterapia e Osteopatia a Casalotti, Roma</h1>
      <p>FisioEVA — Studio di Fisioterapia e Osteopatia. Via di Boccea, 755, 00166 Roma (Casalotti), all'incrocio tra Via di Boccea e Via della Cellulosa, con parcheggio. Telefono e WhatsApp: +39 392 960 5972. Email: fisioeva.boccea@gmail.com. Orari: Lunedì — Venerdì: 08:00 — 20:00 · Sabato: 08:00 — 14:00 · Domenica: Chiuso.</p>
      <p>Fisioterapia, osteopatia e riabilitazione in Via di Boccea 755, tra Casalotti e Boccea. Tre titolari, fisioterapiste e osteopate, e un percorso costruito sulla persona: prima si ascolta e si valuta, poi si tratta. Riceviamo pazienti da Casalotti, Boccea, Selva Candida, Torrevecchia, Valle Santa, Casal Selce e Montespaccato, nel quadrante nord-ovest di Roma.</p>
      <h2>Servizi</h2>
      <ul>
        <li><strong>Terapia manuale e osteopatia</strong> — Valutazione osteopatica e trattamento manuale per sciogliere le tensioni, ridurre il dolore e restituire mobilità alle articolazioni. Ogni seduta parte da ciò che il tuo corpo racconta. (Osteopatia, Terapia manuale, Linfodrenaggio, Taping neuromuscolare)</li>
        <li><strong>Riabilitazione e rieducazione</strong> — Percorsi di recupero dopo un intervento, un infortunio sportivo o un periodo di stop. Il programma cresce con te, seduta dopo seduta, fino al ritorno alle tue attività. (Rieducazione post-chirurgica, Rieducazione motoria e neuromotoria, Rieducazione sportiva, Fisiokinesiterapia)</li>
        <li><strong>Postura e movimento</strong> — Analisi posturale e ginnastica dedicata per correggere gli squilibri che si accumulano ogni giorno, tra scrivania, sport e gesti ripetuti. (Ginnastica Posturale Individuale, Valutazione posturale, Consapevolezza corporea)</li>
        <li><strong>Terapie fisiche strumentali</strong> — Strumenti che accelerano il recupero e agiscono sull'infiammazione, sempre integrati in un percorso terapeutico e mai usati come scorciatoia. (Tecarterapia, Laser ad alta potenza, Ultrasuonoterapia, Magnetoterapia, Tens · Ionoforesi, Elettrostimolazione)</li>
      </ul>
      <p>Ci occupiamo anche di salute della donna (pavimento pelvico, gravidanza, post-parto, cicatrice da cesareo) e di osteopatia neonatale e pediatrica. Elenco completo: <a href="/servizi">servizi e trattamenti</a>.</p>
      <h2>Le titolari</h2>
      <h3>Dott.ssa Azzurra De Angelis</h3>
      <p>Fisioterapista · Osteopata D.O. — Albo dei Fisioterapisti n. 6174, Ordine TSRM-PSTRP di Roma.</p>
      <p>Si è laureata in Fisioterapia nel 2011 all'Università Cattolica del Sacro Cuore con 110/110 e lode, con una tesi in riabilitazione neurologica. Ha proseguito con il Master in Rieducazione Posturale Globale di P. Souchard, si è specializzata in linfodrenaggio manuale e ha completato gli studi in Osteopatia alla scuola EDUCAM, di nuovo con 110/110 e lode. Dalla tesi sulla cicatrice da taglio cesareo nasce il suo lavoro con le donne in gravidanza e nel post-parto.</p>
      <h3>Dott.ssa Elisa De Rubeis</h3>
      <p>Fisioterapista — Albo dei Fisioterapisti n. 4948, Ordine TSRM-PSTRP di Roma.</p>
      <p>Si è laureata in Fisioterapia nel 2004 con 110/110 e lode, con una tesi sul legame tra emozione, postura e respiro — il filo che ha poi seguito in tutta la sua formazione. Ha proseguito con il master in Rieducazione Posturale Globale secondo il metodo Souchard, il corso annuale di terapia manuale secondo il concetto Maitland e i livelli di cranio-sacrale e di manipolazione fasciale viscerale del metodo Upledger. Lavora con il Pilates applicato alla colonna e con la ginnastica ipopressiva post-partum. Oggi è al terzo anno della formazione quadriennale in metodo Feldenkrais.</p>
      <h3>Dott.ssa Veronica Mirarchi</h3>
      <p>Fisioterapista · Osteopata D.O. — Albo dei Fisioterapisti n. 11463, Ordine TSRM-PSTRP di Roma.</p>
      <p>Si è diplomata in Osteopatia presso il CERDO nel 2020, con una tesi dedicata al trattamento osteopatico delle disfunzioni gastrointestinali. Nel 2025 si è laureata in Fisioterapia presso l’Università UniCamillus con 110/110 e lode, discutendo una tesi sulla riabilitazione del pavimento pelvico nelle donne con endometriosi. Durante il percorso universitario ha svolto un importante periodo di formazione presso il CONI, lavorando a contatto con atleti di livello internazionale. Il suo passato da sportiva e l’interesse per la salute femminile orientano oggi il suo lavoro, nel quale integra fisioterapia e osteopatia attraverso un approccio globale e attento alle esigenze della persona.</p>
      <h2>Il percorso di cura, passo dopo passo</h2>
      <ol>
        <li><strong>Prenota una visita</strong> — Scegli il momento più adatto per iniziare il tuo percorso di benessere con noi.</li>
        <li><strong>Colloquio iniziale</strong> — Un momento dedicato per ascoltare la tua storia clinica e comprendere i tuoi obiettivi.</li>
        <li><strong>Valutazione clinica</strong> — Analisi clinica e posturale del tuo corpo per individuare le cause specifiche del problema, non solo i sintomi.</li>
        <li><strong>Piano terapeutico</strong> — Un programma personalizzato, costruito sul tuo problema e sul tuo stile di vita.</li>
        <li><strong>Terapia manuale</strong> — Trattamenti mirati per alleviare il dolore, ripristinare la mobilità e la funzione.</li>
        <li><strong>Mantenimento</strong> — Esercizi e attività di gruppo con l'associazione culturale StudioEVA per mantenere i risultati nel tempo e prevenire ricadute.</li>
      </ol>
