<!doctype html>
<html lang="it">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#c197c5" />

    <!--
      Il sito è chiuso ai motori di ricerca finché non apre lo studio. Il blocco
      sta in tre punti, e vanno tolti tutti e tre insieme:
        1. PUBBLICO in src/data/site.ts (governa robots.txt e il meta robots)
        2. l'header X-Robots-Tag in vercel.json
        3. il meta qui sotto
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Anteprima quando il link viene condiviso. Titolo, descrizione e URL
         vengono poi riscritti per ogni pagina da usePageMeta. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FisioEVA" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="FisioEVA — Studio di Fisioterapia e Osteopatia | Roma" />
    <meta property="og:description" content="Studio di Fisioterapia e Osteopatia in Via di Boccea 755, Roma. Un percorso costruito su di te, in ogni fase della vita." />
    <meta name="twitter:card" content="summary_large_image" />

    <title>FisioEVA — Studio di Fisioterapia e Osteopatia | Roma</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
